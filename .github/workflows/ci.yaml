name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: make check
      - run: make build
      # Python helpers that guard GPU measurement labels (renders compose with placeholders).
      - run: make gpu-config-check
